<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signIn</title>
    <link rel="stylesheet" href="assets/css/pages/signin.css">
    <link rel="stylesheet" href="assets/css/pages/signinMobile.css" media="(max-width: 768px)">
</head>
<body>
    <header>
        <div class="header">
            <picture class="logo">
                <img src="assets/images/hbo-logo.svg" alt="logo da HBO">
            </picture>
            <div class="header-links">
                <a href="signIn.html" class="btn-header btn-geral">
                    Entrar
                </a>
                <a href="#assinar" class="btn-header btn-geral">
                    Assine Agora
                </a>
            </div>
        </div>
    </header>
    <main>
        <section >
            <div class="section-container">
                <div class="
                first-section">
                    <div class="container-h1">
                        <h1 class="txt-h1">
                            Entrar
                        </h1>
                    </div>
                    <div class="container-p">
                        <p class="txt-p">
                            Você tem uma conta da HBO Max?
                        </p>
                    </div>
                    <div class="formulario-container">
                        <form action="#" class="formulario">
                            <input class="input" type="email" name="formEmail" id="formEmail" placeholder="Endereço de e-mail"
                            >
                            <input class="input" type="password" name="formPassword" id="formPassword" placeholder="Senha" minlength="8">
                            <div class="btn-container">
                                <button type="submit" class="btn-login">Entrar</button>
                                <a href="#" class="btn-forgot">
                                    <span>Esqueceu a Senha?</span>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="bg">
        <div class="container-footer">
            <div class="nav-footer">
                <a href="https://www.hbomax.com/br/pt/sitemap" target="_blank">
                    <p class="txt-footer">
                        Agora na HBO MAX
                    </p>
                </a>
                <a href="" target="_blank">
                    <p class="txt-footer">
                        Em Breve
                    </p>
                </a>
                <a href="" target="_blank">
                    <p class="txt-footer">
                        Filmes Em Destaques
                    </p>
                </a>
                <a href="" target="_blank">
                    <p class="txt-footer">
                        Séries
                    </p>
                </a>
                <a href="https://help.hbomax.com/br" target="_blank">
                    <p class="txt-footer">
                        Ajuda
                    </p>
                </a>
            </div>
            <div class="container-coppy">
                <p class="txt-coppy">
                    © 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob
                    licença
                </p>
            </div>
        </div>
        <div class="container-sociais">
            <img src="assets/images/fb_0.png" alt="">
            <img src="assets/images/twitter_0.png" alt="">
            <img src="assets/images/instagram_0.png" alt="">
            <img src="assets/images/youtube_0.png" alt="">
        </div>
    </footer>
    
</body>
</html>
